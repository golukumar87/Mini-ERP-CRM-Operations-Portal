services:
  - type: web
    name: mini-erp-crm-api
    env: node
    plan: free
    buildCommand: npm install --workspace server && npm run build --workspace server
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: change-me
